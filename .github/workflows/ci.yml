name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/roster?schema=public
      POSTGRES_DB: roster
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      JWT_SECRET: test-secret-that-is-at-least-32-characters-long
      JWT_EXPIRES_IN: 8h
      COOKIE_SECURE: "false"
      BUSINESS_TIME_ZONE: Asia/Jerusalem
      RUN_DB_INTEGRATION_TESTS: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roster
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d roster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate --workspace=backend
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: docker compose build
